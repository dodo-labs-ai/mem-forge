server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The admin UI; client-side routes fall back to its own index.html.
    location /v2/ {
        try_files $uri $uri/ /v2/index.html;
    }

    # Deprecated (admin-ui-v1): the V1 admin UI. When V1 is removed, the admin
    # UI moves to / and this block takes over its fallback (ADR 0044).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
