server {
    listen 8080;
    server_name _;

    # Redirects carry only the path, so they keep the host and port the
    # browser used rather than the container's own port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deprecated (admin-ui-v1): the V1 admin UI; client-side routes fall back
    # to its own index.html. Remove with V1.
    location /v1/ {
        try_files $uri $uri/ /v1/index.html;
    }

    # Deprecated (admin-ui-v1): the admin UI was served at /v2/ while V1 owned
    # /. Its links answer 301 to the same page at /, keeping the query, for the
    # release that serves V1 at /v1/. The target is cut from the request as
    # sent, so percent-encoded segments stay encoded, and it drops every
    # leading slash, so /v2//host cannot become a protocol-relative URL.
    # Remove with V1.
    location ~ ^/v2(/|$) {
        if ($request_uri ~ "^/v2/*(.*)$") {
            return 301 /$1;
        }
    }

    # The admin UI; client-side routes fall back to its index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
