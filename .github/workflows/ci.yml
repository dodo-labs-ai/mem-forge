name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request replaces the run for the older commit. Runs on
# main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A change confined to documentation leaves every other job's inputs
  # untouched, so those jobs are skipped; a skipped job still satisfies a
  # required check. Only the top level of docs/ counts as documentation, so a
  # file added in a docs/ subdirectory still runs the documentation boundary
  # test.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          documentation='^(docs/[^/]+\.md|README\.md|CHANGELOG\.md|AGENTS\.md|CLAUDE\.md|CONTRIBUTING\.md|CODE_OF_CONDUCT\.md|SECURITY\.md|\.github/assets/.+|\.github/ISSUE_TEMPLATE/.+|\.github/PULL_REQUEST_TEMPLATE\.md)$'
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! changed=$(git diff --name-only "$BASE...$HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -Eqv "$documentation"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --extra dev
      - run: uv build
      - run: uv run python scripts/verify_release_artifacts.py dist
      - run: uv run python scripts/sync_plugin_mcp_proxy.py --check
      - run: uv run python scripts/export_openapi.py admin/openapi/admin.json --check
      - run: uv run python scripts/export_source_type_forms.py admin/src/test/fixtures/sourceTypeForms.json --check
      - run: uv run ruff check src tests scripts/sync_plugin_mcp_proxy.py scripts/export_openapi.py scripts/export_source_type_forms.py scripts/provider_smoke.py scripts/compose_smoke.py scripts/smoke_env.py
      - run: uv run pytest -q -n 4 --dist worksteal --durations=25 --durations-min=0.2

  admin:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:api
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Deprecated (admin-ui-v1): remove this job with the V1 admin UI.
  admin-ui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
